    <g stroke="#1C1512" stroke-opacity=".4" stroke-width="1" fill="none">
      <path d="M380 250 q 4 -72 11 -120"/>
      <path d="M397 250 q 4 -72 11 -120"/>
      <path d="M414 250 q 4 -72 11 -120"/>
      <path d="M431 250 q 4 -72 11 -120"/>
      <path d="M447 250 q 4 -72 11 -120"/>
      <path d="M464 250 q 4 -72 11 -120"/>
      <path d="M481 250 q 4 -72 11 -120"/>
      <path d="M498 250 q 4 -72 11 -120"/>
      <path d="M515 250 q 4 -72 11 -120"/>
      <path d="M532 250 q 4 -72 11 -120"/>
      <path d="M548 250 q 4 -72 11 -120"/>
      <path d="M565 250 q 4 -72 11 -120"/>
      <path d="M582 250 q 4 -72 11 -120"/>
      <path d="M599 250 q 4 -72 11 -120"/>
      <path d="M616 250 q 4 -72 11 -120"/>
      <path d="M633 250 q 4 -72 11 -120"/>
      <path d="M649 250 q 4 -72 11 -120"/>
      <path d="M666 250 q 4 -72 11 -120"/>
      <path d="M683 250 q 4 -72 11 -120"/>
      <path d="M700 250 q 4 -72 11 -120"/>
