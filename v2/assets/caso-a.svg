<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-label="Antes e depois da linha frontal">
  <defs>
    <linearGradient id="bgca" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0%" stop-color="#E8DACA"/>
      <stop offset="52%" stop-color="#DCCBB6"/>
      <stop offset="100%" stop-color="#CDB79E"/>
    </linearGradient>
    <linearGradient id="skca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#947051" stop-opacity=".62"/>
      <stop offset="100%" stop-color="#6B4F37" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="vgca" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1C1512" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1C1512" stop-opacity=".28"/>
    </linearGradient>
    <pattern id="grca" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r=".7" fill="#6B4F37" opacity=".07"/>
      <circle cx="4.5" cy="4.5" r=".7" fill="#6B4F37" opacity=".05"/>
    </pattern>
  </defs>
  <clipPath id="clca"><rect x="0" y="0" width="360.0" height="480"/></clipPath>
  <clipPath id="crca"><rect x="360.0" y="0" width="360.0" height="480"/></clipPath>
  <rect width="720" height="480" fill="url(#bgca)"/>
  <rect width="720" height="480" fill="url(#grca)"/>

  <g clip-path="url(#clca)">
    <ellipse cx="180" cy="317" rx="126" ry="158" fill="#8E8378" opacity=".8"/>
    <path d="M50 250 Q 180 125 310 250"
          fill="#6E655C" opacity=".75"/>
  </g>

  <g clip-path="url(#crca)">
