  <line x1="360.0" y1="18" x2="360.0" y2="462" stroke="#F3E9DD" stroke-opacity=".7" stroke-width="1"/>
  <rect x="14" y="14" width="692" height="452" fill="none" stroke="#947051" stroke-opacity=".3" stroke-width="1"/>
  <text x="180.0" y="456" fill="#4A4139" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="500" letter-spacing="0.28em" text-anchor="middle">ANTES</text>
  <text x="540.0" y="456" fill="#1C1512" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="500" letter-spacing="0.28em" text-anchor="middle">DEPOIS</text>
</svg>
